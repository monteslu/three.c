name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri

      - name: Fetch Box2D and Box3D
        run: |
          git clone https://github.com/erincatto/box2d ../box2d
          git -C ../box2d checkout c05c48738fbe5c27625e36c5f0cfbdaddfc8359a
          git clone https://github.com/erincatto/box3d ../box3d
          git -C ../box3d checkout 29bf523ce7bc4590aba9f17c9db791cdc5c4397e

      - name: Build
        run: ./build.sh

      - name: Test (Mesa llvmpipe, headless)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: test/run.sh
